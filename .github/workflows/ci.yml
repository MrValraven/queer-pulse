name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned toolchain — bump deliberately, not implicitly. Mirrors the backend
# workflow (queerpulse-backend/.github/workflows/ci.yml) so both repos move in
# lockstep. Node/pnpm here match package.json (packageManager pnpm@9.15.0,
# engines.node >=20.11).
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  # Required gate: lint, the authoritative typecheck, the a11y ratchet, and the
  # Vitest suite. This is the P1-7 fix — the FE `build` script never ran tests,
  # so the ~120 test files could rot; CI now runs `vitest run` on every PR/push.
  # Equivalent to `pnpm verify` (package.json), kept as discrete steps here for
  # clearer per-check CI annotations.
  lint-typecheck-test:
    name: lint · typecheck · a11y · unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `tsc -b --noEmit` is the authoritative typecheck (strict app config) —
      # `tsc -p .` is looser and hides real build errors.
      - name: Typecheck
        run: pnpm typecheck

      # Accessibility ratchet (BUDGET=0). A new unlabelled control fails here.
      - name: Accessibility ratchet
        run: pnpm lint:a11y

      - name: Unit tests (Vitest)
        run: pnpm test

  # Optional, isolated job: Playwright e2e + the axe contrast pass (X-7). Kept
  # OUT of the required gate above because it downloads browser binaries and
  # boots a dev server, which can be flaky in CI; a failure here should not block
  # a PR whose unit/lint/typecheck are green. The specs run the app in DEMO mode
  # (playwright.config.ts sets VITE_DEMO=1, no VITE_API_URL), so no backend or
  # database service is needed.
  e2e:
    name: e2e · axe contrast (optional)
    runs-on: ubuntu-latest
    # Do not fail the overall CI run if the browser-driven suite is flaky.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # Boots `pnpm dev` via playwright.config.ts webServer, runs every spec in
      # e2e/ (request-invite happy path + the axe color-contrast pass).
      - name: E2E + contrast (Playwright)
        run: pnpm test:e2e
