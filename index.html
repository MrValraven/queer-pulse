<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QueerPulse — a quiet, vouched-for network for LGBTQ+ professionals, creatives and community in Lisbon."
    />
    <meta name="theme-color" content="#2D1B3D" />

    <!-- Open Graph / social link-unfurl previews (invite links, shares) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QueerPulse" />
    <meta property="og:url" content="https://queerpulse.com/invite" />
    <meta property="og:title" content="You've been invited to QueerPulse" />
    <meta
      property="og:description"
      content="A quiet, vouched-for network for LGBTQ+ professionals, creatives and community in Lisbon — no ads, no algorithm. This invitation was created for you."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1566835770430-27dde2eb4367?w=1200&h=630&fit=crop&crop=entropy&q=80"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QueerPulse — a queer community in Lisbon" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You've been invited to QueerPulse" />
    <meta
      name="twitter:description"
      content="A quiet, vouched-for queer community in Lisbon — no ads, no algorithm. Your invitation is personal."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1566835770430-27dde2eb4367?w=1200&h=630&fit=crop&crop=entropy&q=80"
    />
    <meta name="twitter:image:alt" content="QueerPulse — a queer community in Lisbon" />

    <title>QueerPulse — a queer professional network, rooted in Lisbon</title>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
