<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The ICO carries hand-fitted 16 and 32 px rasters (Google Search ignores
         SVG favicons); `sizes` keeps Chrome from preferring it over the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here, so this must stay a PNG. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180-v3.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values on iOS; without it every safe-area calculation in the app is 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="QueerPulse: a quiet, vouched-for network for LGBTQ+ professionals, creatives and community in Lisbon."
    />
    <!-- Paired theme-color: the browser toolbar tint follows the OS colour
         scheme. Light keeps the brand plum chrome; dark matches the app's dark
         page background (--cream in [data-theme="dark"], #0E0820) so the toolbar
         blends instead of glowing plum over a near-black UI. A bare fallback is
         kept last for engines that ignore the media attribute. -->
    <meta
      name="theme-color"
      content="#2D1B3D"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0E0820"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="theme-color" content="#2D1B3D" />

    <!--
      Installed-app boot cover, the frame BETWEEN the OS launch screen and the
      AppLaunch overlay (src/features/system/AppLaunch.tsx).

      The document at the manifest's start_url ("/?mode=standalone") is the
      prerendered marketing homepage (scripts/prerender.mjs bakes "/" into
      dist/index.html), and the browser paints that markup the moment the
      stylesheet lands, well before main.tsx has run and React has mounted the
      plum overlay. Members saw it: OS splash, a flash of the landing page,
      then the boot sequence. The shortcuts and spa.html would show a cream
      body in that same gap instead.

      So while the app is installed (the same display-mode query
      DisplayModeProvider reads) and React has not yet stamped
      `data-display-mode` on <html> (it does so in its first commit, the same
      one that mounts the overlay), the ground is the manifest's plum and #root
      is hidden. The value is --plum by hand: no token exists before the bundle.

      This only works because the prerender strips React's runtime stamps from
      <html> before baking a page (scripts/prerender.mjs, assertCleanRootElement).
      A baked `data-display-mode="browser"` on the homepage made this selector
      never match, and the flash came back.
      Inline <style> is allowed by vercel.json's CSP (style-src 'unsafe-inline');
      an inline <script> would not be.
    -->
    <style>
      @media (display-mode: standalone), (display-mode: fullscreen) {
        html:not([data-display-mode]),
        html:not([data-display-mode]) body {
          background: #2d1b3d;
        }
        html:not([data-display-mode]) #root {
          visibility: hidden;
        }
      }
    </style>

    <!-- Installed-app presentation. `black-translucent` lets the page extend
         under the status bar; the slim app bar (Navbar.module.css .appBar) pads
         itself by env(safe-area-inset-top) so the clock reads against the bar
         rather than against content. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="QueerPulse" />

    <!--
      iOS launch (splash) images.

      iOS ignores the manifest's `background_color` and picks a launch screen
      from the `apple-touch-startup-image` whose media query matches the
      device's exact CSS size AND pixel ratio AND orientation. There is no
      wildcard and no scaling: a device that matches nothing gets a generated
      screen instead (the app icon centred on a flat field), which is the
      wrong-looking launch the AppLaunch boot sequence exists to replace.

      Every href below is generated by `pnpm icons`
      (scripts/generate-icons.mjs, SPLASH_SIZES) as a full-bleed --plum canvas
      with the mark + wordmark, so this list and that array must be edited
      together. Pixel size = css-width x ratio by css-height x ratio, which is
      why the filename carries the pixel dimensions and the media query the CSS
      ones.

      This list cannot be exhaustive: every new device size ships before we can
      add its PNG. The catch-all is the manifest's `background_color` (plum, in
      vite.config.ts) — an unmatched device then generates its launch screen on
      the same plum ground the boot sequence opens on, so the handoff still
      reads as one screen rather than a cream flash.

      Portrait only, except the 430x932 family, which has a landscape companion.
      Add landscape variants for the others the same way if wanted.
    -->
    <!-- 17 Pro Max / 16 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- 17 / 17 Pro / 16 Pro -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1206x2622.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- 16 Plus / 15 Plus / 15 Pro Max / 14 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"

    <!-- 16 Plus / 15 Plus / 15 Pro Max / 14 Pro Max -->

    <!-- 14 Plus / 13 Pro Max / 12 Pro Max -->

    />
    <!-- 16 / 16e / 15 / 15 Pro / 14 Pro -->

    <!-- 14 / 13 / 13 Pro / 12 / 12 Pro -->

    <!-- 13 mini / 12 mini / 11 Pro / X / XS -->

    <!-- 11 Pro Max / XS Max -->

    <!-- SE / 8 / 7 / 6s -->

    <!--
      Base / default social metadata. NEUTRAL, brand-level copy only — this
      static shell is served to every route and to every non-JS social scraper,
      so it must never be invite-specific. Per-route overrides come from
      <PageMeta> (src/shared/seo). Keep these in sync with `defaultMeta` in
      src/shared/seo/seo.data.ts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QueerPulse" />
    <meta
      property="og:title"
      content="QueerPulse: a queer network, rooted in Lisbon"
    />
    <meta
      property="og:description"
      content="A place to discover what's happening across Lisbon's queer community and find the people, communities, events, and opportunities shaping queer life in the city."
    />
    <meta property="og:image" content="https://queerpulse.com/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="QueerPulse: a queer network, rooted in Lisbon"
    />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="QueerPulse: a queer network, rooted in Lisbon"
    />
    <meta
      name="twitter:description"
      content="A place to discover what's happening across Lisbon's queer community and find the people, communities, events, and opportunities shaping queer life in the city."
    />
    <meta
      name="twitter:image"
      content="https://queerpulse.com/og-default.png"
    />
    <meta
      name="twitter:image:alt"
      content="QueerPulse: a queer network, rooted in Lisbon"
    />

    <title>QueerPulse: a queer network, rooted in Lisbon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
