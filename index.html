<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here, so this must stay a PNG. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180-v2.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values on iOS; without it every safe-area calculation in the app is 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="QueerPulse — a quiet, vouched-for network for LGBTQ+ professionals, creatives and community in Lisbon."
    />
    <!-- Paired theme-color: the browser toolbar tint follows the OS colour
         scheme. Light keeps the brand plum chrome; dark matches the app's dark
         page background (--cream in [data-theme="dark"], #0E0820) so the toolbar
         blends instead of glowing plum over a near-black UI. A bare fallback is
         kept last for engines that ignore the media attribute. -->
    <meta
      name="theme-color"
      content="#2D1B3D"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0E0820"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="theme-color" content="#2D1B3D" />

    <!-- Installed-app presentation. `black-translucent` lets the page extend
         under the status bar; the slim app bar (Navbar.module.css .appBar) pads
         itself by env(safe-area-inset-top) so the clock reads against the bar
         rather than against content. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="QueerPulse" />

    <!--
      iOS launch (splash) images. iOS ignores the manifest's background_color
      and shows a WHITE flash on cold-launch of an installed PWA unless it finds
      an apple-touch-startup-image matching the device's exact CSS size ×
      pixel-ratio. There is no wildcard: each device needs its own PNG.

      ASSETS TO PRODUCE (a human/design step — put them in public/splash/,
      each a full-bleed --plum #2D1B3D canvas with the centred wordmark, at the
      PIXEL size = css-width×ratio by css-height×ratio):
        splash/iphone-2796x1290.png  (430×932 @3 — 15/14 Pro Max)   [landscape swap for portrait tag below]
        splash/iphone-1290x2796.png  (430×932 @3 — 15/14 Pro Max, portrait)
        splash/iphone-1179x2556.png  (393×852 @3 — 15/15 Pro/14 Pro)
        splash/iphone-1170x2532.png  (390×844 @3 — 14/13/12)
        splash/iphone-1125x2436.png  (375×812 @3 — 13 mini/12 mini/11 Pro/X/XS)
        splash/iphone-1242x2688.png  (414×896 @3 — 11 Pro Max/XS Max)
        splash/iphone-828x1792.png   (414×896 @2 — 11/XR)
        splash/iphone-750x1334.png   (375×667 @2 — SE/8/7/6s)
        splash/ipad-1536x2048.png    (768×1024 @2 — common iPad, portrait)
      Consider adding a generator to scripts/generate-icons.mjs (same sharp
      pipeline) so these stay in sync. Until the PNGs exist these tags 404
      harmlessly and iOS simply falls back to the white launch screen.
      Media queries are portrait, except the 15/14 Pro Max, which also has a
      landscape variant (orientation:landscape → iphone-2796x1290.png). Add
      landscape variants for the other devices the same way if wanted.
    -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- Landscape companion for the 15/14 Pro Max: same device dimensions, only
         the orientation + asset differ, so a landscape cold-launch gets the
         2796×1290 splash instead of the white flash. -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-2796x1290.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/iphone-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/ipad-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />

    <!--
      Base / default social metadata. NEUTRAL, brand-level copy only — this
      static shell is served to every route and to every non-JS social scraper,
      so it must never be invite-specific. Per-route overrides come from
      <PageMeta> (src/shared/seo). Keep these in sync with `defaultMeta` in
      src/shared/seo/seo.data.ts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QueerPulse" />
    <meta property="og:url" content="https://queerpulse.com/" />
    <meta
      property="og:title"
      content="QueerPulse — a queer professional network, rooted in Lisbon"
    />
    <meta
      property="og:description"
      content="A quiet, vouched-for network for LGBTQ+ professionals, creatives and community in Lisbon — no ads, no algorithm."
    />
    <meta property="og:image" content="https://queerpulse.com/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="QueerPulse — a queer community in Lisbon"
    />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="QueerPulse — a queer professional network, rooted in Lisbon"
    />
    <meta
      name="twitter:description"
      content="A quiet, vouched-for queer community in Lisbon — no ads, no algorithm."
    />
    <meta
      name="twitter:image"
      content="https://queerpulse.com/og-default.png"
    />
    <meta
      name="twitter:image:alt"
      content="QueerPulse — a queer community in Lisbon"
    />

    <title>QueerPulse — a queer professional network, rooted in Lisbon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
