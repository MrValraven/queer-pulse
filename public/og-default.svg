<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="QueerPulse — a queer community, rooted in Lisbon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1b3d"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.5" stop-color="#f2a65a"/>
      <stop offset="1" stop-color="#4fbf8f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#stripe)"/>
  <text x="90" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#f7f3ee">QueerPulse</text>
  <text x="92" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="#ff6b5e">A world, not a feature list.</text>
  <text x="92" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#d8cfe0">A quiet, vouched-for network for LGBTQ+ professionals,</text>
  <text x="92" y="458" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#d8cfe0">creatives and community — rooted in Lisbon.</text>
  <text x="92" y="545" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#9a8fb0">No ads. No algorithm. queerpulse.com</text>
</svg>
